[package]
name = "remote-ex-rendezvous"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
remote-ex-rendezvous-protocol = { path = "../../crates/rendezvous-protocol" }
remote-ex-security = { path = "../../crates/security" }
remote-ex-signaling = { path = "../../crates/signaling" }
serde.workspace = true
serde_json.workspace = true
rand_core.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
futures-util = "0.3"

axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
remote-ex-rendezvous-client = { path = "../../crates/rendezvous-client" }
rcgen = "0.13"
tokio-tungstenite = "0.28"

