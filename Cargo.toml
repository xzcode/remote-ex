[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "crates/security", "crates/signaling", "crates/input"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
prost = "0.13"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
