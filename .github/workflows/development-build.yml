name: Desktop development builds
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/development-build.yml'
      - 'scripts/ci/install-gstreamer.*'
      - 'docs/DEV_BUILD.md'
      - 'scripts/ci/macos-development-info.plist'
permissions:
  contents: read
concurrency:
  group: development-build-${{ github.ref }}
  cancel-in-progress: false
env:
  GST_VERSION: '1.26.11'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official GStreamer SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-gstreamer.ps1
      - name: Install official GStreamer SDK (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/install-gstreamer.sh
      - name: Check GStreamer SDK
        shell: bash
        run: |
          "${PKG_CONFIG:-pkg-config}" --modversion gstreamer-1.0 gstreamer-webrtc-1.0 gstreamer-app-1.0
          gst-inspect-1.0 webrtcbin
          gst-inspect-1.0 vp8enc
      - name: Build desktop
        working-directory: apps/desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run tauri build -- --no-bundle
      - name: Build native capture and control programs
        shell: bash
        run: |
          cargo build --release --manifest-path crates/media/Cargo.toml --features native-control --bins
      - name: Verify macOS media runtime linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib
          test -e "$root/libgstapp-1.0.0.dylib"
          for name in lan_view lan_diagnostic lan_control; do
            bin="crates/media/target/release/$name"
            otool -L "$bin"
            otool -l "$bin" | grep -F "path $root "
            codesign --force --sign - "$bin"
          done
      - name: Check native input
        shell: bash
        run: cargo test -p remote-ex-input --features native
      - name: Secure control test without OS input
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          python3 scripts/test_secure_control.py "crates/media/target/release/lan_control${suffix}"
      - name: Collect Windows development package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, artifacts | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/remote-ex-desktop.exe stage/
          foreach ($name in @('lan_view','lan_diagnostic','lan_control')) {
            Copy-Item "crates/media/target/release/$name.exe" stage/
          }
          Copy-Item docs/DEV_BUILD.md stage/README.md
          @("commit=$env:GITHUB_SHA", "runtime=$env:GST_VERSION", "architecture=$env:RUNNER_ARCH") | Set-Content stage/BUILD_INFO.txt
          Compress-Archive -Path stage/* -DestinationPath artifacts/Remote-EX-dev-Windows-x64.zip -Force
      - name: Collect macOS development package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="stage/Remote EX.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" artifacts
          cp scripts/ci/macos-development-info.plist "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          cp apps/desktop/src-tauri/target/release/remote-ex-desktop "$app/Contents/MacOS/"
          for name in lan_view lan_diagnostic lan_control; do
            cp "crates/media/target/release/$name" "$app/Contents/MacOS/"
            codesign --force --sign - "$app/Contents/MacOS/$name"
          done
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          cp docs/DEV_BUILD.md stage/README.md
          printf 'commit=%s\nruntime=%s\narchitecture=%s\n' "$GITHUB_SHA" "$GST_VERSION" "$RUNNER_ARCH" > stage/BUILD_INFO.txt
          tar -czf "artifacts/Remote-EX-dev-macOS-$(uname -m).tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: Remote-EX-dev-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
