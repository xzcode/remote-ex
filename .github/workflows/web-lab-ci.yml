name: Web synthetic compatibility lab
on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'crates/media/**'
      - 'crates/security/**'
      - 'servers/signaling/**'
      - 'crates/rendezvous-protocol/**'
      - 'crates/rendezvous-client/**'
      - 'crates/signaling/**'
      - 'docs/protocol/**'
      - '.github/workflows/web-lab-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'crates/security/**'
      - 'docs/protocol/**'
      - '.github/workflows/web-lab-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lab:
    # Playwright 1.56.1 cannot install Chromium on the new 26.04 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Rust synthetic Noise proof and replay fixture
        run: |
          cargo test --manifest-path apps/web/crypto/Cargo.toml
          cargo build --manifest-path apps/web/crypto/Cargo.toml --features fixture-cli --bin native_fixture
      - name: Build isolated browser WASM module
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.106 --locked
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build --release --manifest-path apps/web/crypto/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir apps/web/pkg --out-name noise apps/web/crypto/target/wasm32-unknown-unknown/release/remote_ex_web_crypto.wasm
      - name: Install pinned Chromium test tooling
        id: browser_tooling
        working-directory: apps/web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build disposable enrolled WSS fixture
        id: wss_fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libnss3-tools
          cargo build -p remote-ex-rendezvous
      - name: Browser module syntax and authenticated synthetic media
        working-directory: apps/web
        run: |
          node --check crypto.js
          node --check app.js
          node --check identity.js
          node --check identity-page.js
          node --check wss-fixture.js
          node --check native-wss-fixture.js
          node --check test-native-wss.mjs
          node --check wss-test-support.mjs
          node --check ice-policy.js
          node --check input.js
          node --check touch.js
          node --check mobile.js
          node --check capabilities.js
          node --check wasm-loader.js
          npm run test:wasm-loader
          node --check test-mobile-capabilities.mjs
          node test-mobile-capabilities.mjs
          node --check test-touch-browser.mjs
          node test-touch-browser.mjs
          npm run test:touch
          npm run test:input-source
          npm run test:session-policy
          npm run test:connection-book
          npm run test:policy-input
          node --check test-input-browser.mjs
          npm run test:input-browser
          node --check view-session.js
          node --check view-page.js
          node --check test-view-x11.mjs
          npm test
      - name: Real enrolled WSS and encrypted synthetic media fixture
        if: ${{ !cancelled() && steps.browser_tooling.outcome == 'success' && steps.wss_fixture.outcome == 'success' }}
        working-directory: apps/web
        run: npm run test:wss
      - name: Build native inert media host
        if: ${{ !cancelled() && steps.browser_tooling.outcome == 'success' && steps.wss_fixture.outcome == 'success' }}
        id: native_host
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          sudo apt-get install -y pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice
          cargo build --manifest-path crates/media/Cargo.toml --no-default-features --bin routed_diagnostic
      - name: Independent native GStreamer to browser WSS integration
        if: ${{ !cancelled() && steps.native_host.outcome == 'success' }}
        working-directory: apps/web
        run: timeout 110s npm run test:native-wss
      - name: Build separate inert browser control host (no native features)
        if: ${{ !cancelled() && steps.native_host.outcome == 'success' }}
        id: control_fixture
        run: |
          cargo build --manifest-path crates/media/Cargo.toml --no-default-features --features ci-browser-control --bin browser_control_fixture
      - name: Authenticated browser control and host-confirmed held-input release
        if: ${{ !cancelled() && steps.control_fixture.outcome == 'success' }}
        working-directory: apps/web
        run: timeout 125s npm run test:control-wss
      - name: Build real X11 view candidate
        if: ${{ !cancelled() && steps.native_host.outcome == 'success' }}
        id: x11_host
        run: |
          sudo apt-get install -y build-essential libclang-dev clang libpipewire-0.3-dev libspa-0.2-dev libxcb1-dev libxcb-randr0-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libdbus-1-dev xvfb xauth x11-xserver-utils gstreamer1.0-pipewire coturn iproute2
          cargo build --manifest-path crates/media/Cargo.toml --features native-x11-view --bin routed_x11_view
      - name: Read-only Web UI with actual isolated X11 capture
        if: ${{ !cancelled() && steps.x11_host.outcome == 'success' }}
        working-directory: apps/web
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          xvfb-run -a -s '-screen 0 1024x768x24 +extension RANDR' env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET XDG_SESSION_TYPE=x11 timeout 150s npm run test:view-x11
      - name: Forced TURN read-only Web UI capture
        if: ${{ !cancelled() && steps.x11_host.outcome == 'success' }}
        working-directory: apps/web
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          xvfb-run -a -s '-screen 0 1024x768x24 +extension RANDR' env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET XDG_SESSION_TYPE=x11 timeout 160s npm run test:view-x11 -- --relay-only
      - name: Extended signed Web view and actual quality switching
        if: ${{ !cancelled() && steps.x11_host.outcome == 'success' }}
        working-directory: apps/web
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          xvfb-run -a -s '-screen 0 1024x768x24 +extension RANDR' env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET XDG_SESSION_TYPE=x11 timeout 190s npm run test:view-x11 -- --extended
      - name: Stage private local-only diagnostic bundle
        run: |
          mkdir -p apps/web/dist/pkg
          cp apps/web/index.html apps/web/style.css apps/web/crypto.js apps/web/wasm-loader.js apps/web/capabilities.js apps/web/app.js apps/web/identity.html apps/web/identity.js apps/web/identity-page.js apps/web/dist/
          cp apps/web/pkg/noise.js apps/web/pkg/noise_bg.wasm apps/web/dist/pkg/
          cp docs/protocol/v1-fixture.json apps/web/dist/
          cp apps/web/serve.mjs apps/web/dist/
          cp apps/web/README.md apps/web/dist/
          printf '{"private":true,"type":"module"}\n' > apps/web/dist/package.json
          printf 'commit=%s\nmode=synthetic-local-only\n' "$GITHUB_SHA" > apps/web/dist/BUILD_INFO.txt
          tar -C apps/web/dist -czf /tmp/Remote-EX-web-lab.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Remote-EX-web-lab
          path: /tmp/Remote-EX-web-lab.tar.gz
          if-no-files-found: error
          retention-days: 14
