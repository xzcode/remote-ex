name: Web synthetic compatibility lab
on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'crates/security/**'
      - 'servers/signaling/**'
      - 'crates/rendezvous-protocol/**'
      - 'crates/rendezvous-client/**'
      - 'crates/signaling/**'
      - 'docs/protocol/**'
      - '.github/workflows/web-lab-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'crates/security/**'
      - 'docs/protocol/**'
      - '.github/workflows/web-lab-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    # Playwright 1.56.1 cannot install Chromium on the new 26.04 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Rust synthetic Noise proof and replay fixture
        run: |
          cargo test --manifest-path apps/web/crypto/Cargo.toml
          cargo build --manifest-path apps/web/crypto/Cargo.toml --features fixture-cli --bin native_fixture
      - name: Build isolated browser WASM module
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.106 --locked
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build --release --manifest-path apps/web/crypto/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir apps/web/pkg --out-name noise apps/web/crypto/target/wasm32-unknown-unknown/release/remote_ex_web_crypto.wasm
      - name: Install pinned Chromium test tooling
        id: browser_tooling
        working-directory: apps/web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build disposable enrolled WSS fixture
        id: wss_fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libnss3-tools
          cargo build -p remote-ex-rendezvous
      - name: Browser module syntax and authenticated synthetic media
        working-directory: apps/web
        run: |
          node --check crypto.js
          node --check app.js
          node --check wss-fixture.js
          npm test
      - name: Real enrolled WSS and encrypted synthetic media fixture
        if: ${{ !cancelled() && steps.browser_tooling.outcome == 'success' && steps.wss_fixture.outcome == 'success' }}
        working-directory: apps/web
        run: npm run test:wss
      - name: Stage private local-only diagnostic bundle
        run: |
          mkdir -p apps/web/dist/pkg
          cp apps/web/index.html apps/web/style.css apps/web/crypto.js apps/web/app.js apps/web/dist/
          cp apps/web/pkg/noise.js apps/web/pkg/noise_bg.wasm apps/web/dist/pkg/
          cp docs/protocol/v1-fixture.json apps/web/dist/
          cp apps/web/serve.mjs apps/web/dist/
          cp apps/web/README.md apps/web/dist/
          printf '{"private":true,"type":"module"}\n' > apps/web/dist/package.json
          printf 'commit=%s\nmode=synthetic-local-only\n' "$GITHUB_SHA" > apps/web/dist/BUILD_INFO.txt
          tar -C apps/web/dist -czf /tmp/Remote-EX-web-lab.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Remote-EX-web-lab
          path: /tmp/Remote-EX-web-lab.tar.gz
          if-no-files-found: error
          retention-days: 14
