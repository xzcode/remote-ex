name: Native media engine
on:
  push:
    branches: [master]
    paths: ['crates/media/**', 'crates/signaling/**', 'crates/security/**', 'crates/core/**', 'crates/protocol/**', 'crates/input/**', 'crates/desktop-features/**', 'crates/rendezvous-client/**', 'crates/rendezvous-protocol/**', 'servers/signaling/**', 'scripts/test_routed_diagnostic.py', 'scripts/test_cross_nat.py', 'scripts/test_lan_diagnostic.py', 'scripts/test_secure_view.py', 'scripts/test_secure_control.py', '.github/workflows/media-engine-ci.yml']
  pull_request:
    paths: ['crates/media/**', 'crates/signaling/**', 'crates/security/**', 'crates/core/**', 'crates/protocol/**', 'crates/input/**', 'crates/desktop-features/**', 'crates/rendezvous-client/**', 'crates/rendezvous-protocol/**', 'servers/signaling/**', 'scripts/test_routed_diagnostic.py', 'scripts/test_cross_nat.py', 'scripts/test_lan_diagnostic.py', 'scripts/test_secure_view.py', 'scripts/test_secure_control.py', '.github/workflows/media-engine-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice coturn
      - name: Media bounds tests
        run: cargo test --manifest-path crates/media/Cargo.toml
      - name: WebRTC video loopback
        run: timeout 75s cargo run --manifest-path crates/media/Cargo.toml --bin loopback
      - name: Native RGBA input loopback
        run: timeout 75s cargo run --manifest-path crates/media/Cargo.toml --bin loopback -- --native-pattern
      - name: Independent-process LAN video and control diagnostic
        run: |
          cargo build --manifest-path crates/media/Cargo.toml --bin lan_diagnostic
          timeout 80s python3 scripts/test_lan_diagnostic.py crates/media/target/debug/lan_diagnostic
      - name: Encrypted view-only test with actual DTLS certificate verification
        run: |
          cargo build --manifest-path crates/media/Cargo.toml --bin lan_view
          timeout 90s python3 scripts/test_secure_view.py crates/media/target/debug/lan_view
      - name: Encrypted video and input session, inert backend
        run: |
          cargo build --manifest-path crates/media/Cargo.toml --bin lan_control
          timeout 90s python3 scripts/test_secure_control.py crates/media/target/debug/lan_control
      - name: Three-process WSS rendezvous and authenticated media diagnostic
        run: |
          cargo build -p remote-ex-rendezvous
          cargo build --manifest-path crates/media/Cargo.toml --bin routed_diagnostic
          timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic
      - name: Forced TURN relay with temporary credentials (synthetic only)
        run: timeout 120s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --relay-only
      - name: Independent NAT networks - automatic TURN fallback and forced relay
        # This is a disposable GitHub-hosted Linux runner, not a user host.
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          sudo env REMOTE_EX_ISOLATED_CI=1 python3 scripts/test_cross_nat.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic
      - name: Authorized bidirectional file exchange over WebRTC
        run: |
          timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --file-exchange=host --file-pause
          timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --file-exchange=controller
      - name: Independent authenticated synthetic audio stream
        run: timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --audio-test
      - name: Explicit interrupted checkpoint and authenticated resume
        run: |
          timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --file-exchange=host --file-checkpoint
          timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --file-exchange=host --file-resume
      - name: Bounded authorized directory bundle
        run: timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --file-exchange=controller --directory-exchange
      - name: Bidirectional clipboard sync without OS clipboard access
        run: timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --clipboard-sync-test
      - name: Scoped registration through encrypted media and file catalog
        run: |
          timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --shared-controller
          timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --catalog-test
          timeout 100s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --catalog-batch-test
      - name: Simultaneous VP8 video and Opus RTP audio with inert input
        run: timeout 110s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --av-test
      - name: Explicit host-reviewed file changes in temporary fixture
        run: |
          timeout 110s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --manage-test
          timeout 110s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_diagnostic --manage-directory-test
