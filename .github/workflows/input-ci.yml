name: Native input checks
on:
  push:
    branches: [master]
    paths: ['Cargo.toml', 'crates/input/**', 'crates/core/**', 'crates/protocol/**', 'crates/security/**', '.github/workflows/input-ci.yml']
  pull_request:
    paths: ['Cargo.toml', 'crates/input/**', 'crates/core/**', 'crates/protocol/**', 'crates/security/**', '.github/workflows/input-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: input-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native adapter and test inert dispatch
        run: cargo test -p remote-ex-input --features native
