name: Linux X11 development candidate
on:
  push:
    branches: [master]
    paths:
      - 'apps/desktop/**'
      - 'crates/media/**'
      - 'crates/desktop-features/**'
      - 'crates/rendezvous-client/**'
      - 'scripts/test_routed_diagnostic.py'
      - 'scripts/ci/check_bundle.py'
      - 'scripts/ci/build_identity.py'
      - 'scripts/ci/dependency_inventory.py'
      - 'scripts/ci/build-linux-deb.sh'
      - 'docs/INSTALL.md'
      - '.github/workflows/linux-x11-ci.yml'
      - '.github/preview-release.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-x11-${{ github.ref }}
  cancel-in-progress: true
jobs:
  x11:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Embed explicit build identity
        run: python3 scripts/ci/build_identity.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk dpkg-dev pkg-config build-essential libclang-dev clang libpipewire-0.3-dev libspa-0.2-dev libxcb1-dev libxcb-randr0-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth x11-xserver-utils x11-xkb-utils libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-pipewire
      - name: Build independent X11 media sidecar
        run: |
          cargo build --manifest-path crates/media/Cargo.toml --features native-x11-view --bin routed_x11_view
          cargo build -p remote-ex-rendezvous
      - name: Portal PipeWire element and bounded frame pipeline tests
        run: |
          gst-inspect-1.0 pipewiresrc >/dev/null
          cargo test --manifest-path crates/media/Cargo.toml --features native-x11-view --bin routed_x11_view portal_display::tests
          cargo test --manifest-path crates/media/Cargo.toml --features native-x11-view --bin routed_x11_view portal_control::tests
      - name: Native toolbar system CJK glyph fixture
        run: REMOTE_EX_REQUIRE_CJK_FONT=1 cargo test --manifest-path crates/media/Cargo.toml --features native-x11-view --bin routed_x11_view native_text::tests::installed_cjk_font_fixture
      - name: Reject Wayland even if an XWayland DISPLAY is present
        run: |
          if env XDG_SESSION_TYPE=wayland DISPLAY=:0 crates/media/target/debug/routed_x11_view --probe-x11; then exit 1; fi
      - name: Actual screen capture and authenticated view on isolated Xvfb
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          xvfb-run -a -s '-screen 0 1024x768x24 +extension RANDR' env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET XDG_SESSION_TYPE=x11 timeout 170s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_x11_view --x11-view-test
      - name: Local sharing-pause and fresh-frame resume fixture
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          xvfb-run -a -s '-screen 0 1024x768x24 +extension RANDR' env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET XDG_SESSION_TYPE=x11 timeout 170s python3 scripts/test_routed_diagnostic.py target/debug/remote-ex-rendezvous crates/media/target/debug/routed_x11_view --x11-privacy-test
      - name: XTEST native input fixture on disposable Xvfb
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          xvfb-run -a -s '-screen 0 1024x768x24 +extension RANDR' env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET XDG_SESSION_TYPE=x11 REMOTE_EX_X11_FIXTURE=1 bash -c 'setxkbmap -rules evdev -model pc105 -layout us && cargo test --manifest-path crates/media/Cargo.toml --features native-x11-view --bin routed_x11_view linux_display::tests -- --test-threads=1'
      - name: Build frontend
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund && npm run build
      - name: Linux desktop compile and portable tests
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test -p remote-ex-desktop-features
      - name: Build Linux development desktop and package
        run: |
          (cd apps/desktop && npm run tauri build -- --debug --no-bundle)
          mkdir -p dist/linux-dev
          cp apps/desktop/src-tauri/target/debug/remote-ex-desktop dist/linux-dev/
          cp crates/media/target/debug/routed_x11_view dist/linux-dev/
          cargo build --manifest-path crates/media/Cargo.toml --bin routed_diagnostic --bin lan_view --bin lan_diagnostic
          cp crates/media/target/debug/{routed_diagnostic,lan_view,lan_diagnostic} dist/linux-dev/
          cp target/debug/remote-ex-rendezvous dist/linux-dev/
          cp docs/DEV_BUILD.md dist/linux-dev/
          cp docs/INSTALL.md dist/linux-dev/
          # Strip debug metadata on staging copies only, then test the package.
          strip --strip-debug dist/linux-dev/remote-ex-desktop dist/linux-dev/routed_x11_view dist/linux-dev/routed_diagnostic dist/linux-dev/lan_view dist/linux-dev/lan_diagnostic dist/linux-dev/remote-ex-rendezvous
          python3 scripts/ci/check_bundle.py stamp --dir dist/linux-dev --platform linux
          python3 scripts/ci/check_bundle.py verify --dir dist/linux-dev --platform linux
          python3 scripts/ci/check_bundle.py probe --dir dist/linux-dev --platform linux
          printf 'commit=%s\narchitecture=%s\nbuild=debug\nrelease=%s\n' "$GITHUB_SHA" "$RUNNER_ARCH" "$REMOTE_EX_BUILD_TAG" > dist/linux-dev/BUILD_INFO.txt
          python3 scripts/ci/dependency_inventory.py --out dist/linux-dev/DEPENDENCIES.json --platform linux
          tar -C dist/linux-dev -czf dist/Remote-EX-dev-Linux-x64.tar.gz .
      - name: Build and inspect Debian installer
        run: bash scripts/ci/build-linux-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Remote-EX-dev-Linux-x64
          path: |
            dist/Remote-EX-dev-Linux-x64.tar.gz
            dist/Remote-EX-dev-Linux-x64.deb
          if-no-files-found: error
          retention-days: 14
