name: Publish verified preview release
on:
  workflow_run:
    workflows:
      - Core CI
      - Desktop checks
      - Native input checks
      - Native media engine
      - Desktop development builds
      - Linux X11 development candidate
      - Signaling container preflight
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: remote-ex-preview-release
  cancel-in-progress: false
jobs:
  publish:
    # Never publish an artifact from a fork, pull request, or another branch.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require an explicitly requested preview and all same-commit checks
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          current="$(gh api "repos/$REPO/git/ref/heads/master" --jq '.object.sha')"
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo 'Superseded candidate; no release.'
            exit 0
          fi
          if ! gh api "repos/$REPO/contents/.github/preview-release.json?ref=$HEAD_SHA" --jq '.content' > intent.b64; then
            echo 'No release request for this commit.'
            exit 0
          fi
          base64 -d intent.b64 > intent.json
          jq -e '.prerelease == true and (.tag | type == "string" and test("^v[0-9]+\\.[0-9]+\\.[0-9]+-alpha\\.[0-9]+$"))' intent.json >/dev/null
          tag="$(jq -r '.tag' intent.json)"
          if gh release view "$tag" --repo "$REPO" --json tagName >/dev/null 2>&1; then
            echo "$tag already exists; never overwrite published assets."
            exit 0
          fi
          # Require the explicit release-intent edit on this exact SHA. A
          # later fix must increment attempt in the marker to request a retry.
          changed="$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.files[].filename')"
          if ! grep -Fxq '.github/preview-release.json' <<< "$changed"; then
            echo 'This commit does not explicitly request a preview.'
            exit 0
          fi
          : > checked-runs.tsv
          for workflow in core-ci.yml desktop-ci.yml input-ci.yml media-engine-ci.yml development-build.yml linux-x11-ci.yml container-ci.yml; do
            runs="$(gh api --method GET "repos/$REPO/actions/workflows/$workflow/runs" -f head_sha="$HEAD_SHA" -f branch=master -f event=push -F per_page=10)"
            row="$(jq -c --arg sha "$HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "master" and .event == "push")] | sort_by(.id) | last // empty' <<< "$runs")"
            if [[ -z "$row" ]] || ! jq -e '.status == "completed" and .conclusion == "success"' <<< "$row" >/dev/null; then
              echo "$workflow has not passed on $HEAD_SHA; no release."
              exit 0
            fi
            id="$(jq -r '.id' <<< "$row")"
            [[ "$id" =~ ^[0-9]+$ ]]
            printf '%s\t%s\n' "$workflow" "$id" >> checked-runs.tsv
            case "$workflow" in
              development-build.yml) echo "desktop_run=$id" >> "$GITHUB_OUTPUT" ;;
              linux-x11-ci.yml) echo "linux_run=$id" >> "$GITHUB_OUTPUT" ;;
            esac
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Download exact verified platform archives
        if: steps.gate.outputs.ready == 'true'
        env:
          DESKTOP_RUN: ${{ steps.gate.outputs.desktop_run }}
          LINUX_RUN: ${{ steps.gate.outputs.linux_run }}
          TAG: ${{ steps.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$DESKTOP_RUN" --repo "$REPO" --name Remote-EX-dev-Windows-X64 --dir downloads/windows
          gh run download "$DESKTOP_RUN" --repo "$REPO" --name Remote-EX-dev-macOS-ARM64 --dir downloads/macos
          gh run download "$LINUX_RUN" --repo "$REPO" --name Remote-EX-dev-Linux-x64 --dir downloads/linux
          cp downloads/windows/Remote-EX-dev-Windows-x64.zip "release/Remote-EX-$TAG-Windows-x64.zip"
          cp downloads/macos/Remote-EX-dev-macOS-arm64.tar.gz "release/Remote-EX-$TAG-macOS-arm64.tar.gz"
          cp downloads/linux/Remote-EX-dev-Linux-x64.tar.gz "release/Remote-EX-$TAG-Linux-x64.tar.gz"
          cp downloads/windows/Remote-EX-dev-Windows-x64-Setup.exe "release/Remote-EX-$TAG-Windows-x64-Setup.exe"
          cp downloads/macos/Remote-EX-dev-macOS-arm64.dmg "release/Remote-EX-$TAG-macOS-arm64.dmg"
          cp downloads/linux/Remote-EX-dev-Linux-x64.deb "release/Remote-EX-$TAG-Linux-x64.deb"
      - name: Inspect archive contents, commit stamps and checksums
        if: steps.gate.outputs.ready == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          DESKTOP_RUN: ${{ steps.gate.outputs.desktop_run }}
          LINUX_RUN: ${{ steps.gate.outputs.linux_run }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile, zipfile
          root = pathlib.Path('release')
          tag = os.environ['TAG']
          sha = os.environ['HEAD_SHA']
          # Native packaging jobs hash their outputs only after installer and
          # portable smoke checks. Cross-check all six copied packages, including
          # the opaque Windows Setup and DMG, against their exact native run.
          packages = []
          for platform, arch, run, names in [
              ('windows','X64',os.environ['DESKTOP_RUN'],['Windows-x64.zip','Windows-x64-Setup.exe']),
              ('macos','ARM64',os.environ['DESKTOP_RUN'],['macOS-arm64.tar.gz','macOS-arm64.dmg']),
              ('linux','X64',os.environ['LINUX_RUN'],['Linux-x64.tar.gz','Linux-x64.deb']),
          ]:
              source = pathlib.Path('downloads') / platform / 'PACKAGE_EVIDENCE.json'
              assert 0 < source.stat().st_size <= 16384
              evidence = json.loads(source.read_text(encoding='utf-8'))
              assert evidence['schema'] == 1 and evidence['commit'] == sha and evidence['tag'] == tag
              assert evidence['platform'] == platform and evidence['architecture'] == arch and evidence['run_id'] == run
              records = evidence['packages']
              assert len(records) == 2
              assert {p['name'] for p in records} == {'Remote-EX-dev-'+suffix for suffix in names}
              for suffix in names:
                  name = f'Remote-EX-{tag}-{suffix}'
                  native = next(p for p in records if p['name']=='Remote-EX-dev-'+suffix)
                  path = root/name
                  assert 0 < path.stat().st_size == native['size'] <= 1024*1024*1024
                  with path.open('rb') as stream:
                      digest = hashlib.file_digest(stream,'sha256').hexdigest()
                  assert digest == native['sha256']
                  packages.append({'name':name,'size':native['size'],'sha256':digest,'native_run_id':run,'platform':platform})
          workflows = dict(line.split('\t',1) for line in pathlib.Path('checked-runs.tsv').read_text().splitlines())
          assert set(workflows) == {'core-ci.yml','desktop-ci.yml','input-ci.yml','media-engine-ci.yml','development-build.yml','linux-x11-ci.yml','container-ci.yml'}
          assert workflows['development-build.yml'] == os.environ['DESKTOP_RUN'] and workflows['linux-x11-ci.yml'] == os.environ['LINUX_RUN']
          build = {'schema':1,'tag':tag,'commit':sha,'prerelease':True,'required_workflow_runs':workflows,
                   'packages':packages,'physical_device_acceptance':'pending','license_review':'incomplete','publisher_signing':'not_established'}
          (root/'RELEASE_BUILD.json').write_text(json.dumps(build,indent=2)+'\n',encoding='utf-8')
          cases = [
              ('Windows-x64.zip', {'remote-ex-desktop.exe','routed_control.exe','routed_diagnostic.exe','remote-ex-rendezvous.exe'}, 'x64'),
              ('macOS-arm64.tar.gz', {'Remote EX.app/Contents/MacOS/remote-ex-desktop','Remote EX.app/Contents/MacOS/routed_control','Remote EX.app/Contents/MacOS/remote-ex-mac-audio','remote-ex-rendezvous'}, 'arm64'),
              ('Linux-x64.tar.gz', {'remote-ex-desktop','routed_x11_view','routed_diagnostic','remote-ex-rendezvous'}, 'x64'),
          ]
          def check_components(names, open_member, size, platform, arch, prefix, manifest_name):
              component_names = {
                  'windows': {'lan_view.exe','lan_diagnostic.exe','lan_control.exe','routed_diagnostic.exe','routed_control.exe'},
                  'macos': {'lan_view','lan_diagnostic','lan_control','routed_diagnostic','routed_control','remote-ex-mac-audio'},
                  'linux': {'lan_view','lan_diagnostic','routed_x11_view','routed_diagnostic'},
              }[platform]
              assert manifest_name in names and size(names[manifest_name]) <= 16384
              with open_member(names[manifest_name]) as stream:
                  manifest = json.load(stream)
              assert manifest['schema'] == 1 and manifest['commit'] == sha
              assert manifest['platform'] == platform and manifest['arch'] == arch
              entries = manifest['files']
              assert len(entries) == len(component_names)
              assert {e['name'] for e in entries} == component_names
              for e in entries:
                  member = names[prefix + e['name']]
                  assert 0 < e['size'] <= 512*1024*1024 and size(member) == e['size']
                  with open_member(member) as stream:
                      assert hashlib.file_digest(stream, 'sha256').hexdigest() == e['sha256']
          def check_inventory(names, open_member, size, platform):
              member = names['DEPENDENCIES.json']
              assert 0 < size(member) <= 8*1024*1024
              with open_member(member) as stream:
                  inventory = json.load(stream)
              assert inventory['schema'] == 1 and inventory['commit'] == sha and inventory['platform'] == platform
              assert 0 < len(inventory['packages']) <= 10000
              assert {'workspace','media','desktop','frontend'} <= {p['scope'] for p in inventory['packages']}
              summary = inventory['license_evidence_summary']
              assert inventory['license_review'] == 'incomplete'
              assert summary['total'] == len(inventory['packages'])
              assert summary['declared'] == sum('declared_license' in p for p in inventory['packages'])
              assert sum(summary['review_flags'].values()) == summary['total']
              assert all(p.get('license_evidence') and p.get('license_review_flag') for p in inventory['packages'])
          def inspect(path, required):
              if path.suffix == '.zip':
                  with zipfile.ZipFile(path) as archive:
                      names = {x.filename.removeprefix('./'):x for x in archive.infolist() if not x.is_dir()}
                      assert required <= names.keys(), f'{path.name}: missing binaries'
                      check_components(names, archive.open, lambda m:m.file_size, 'windows', 'x86_64', '', 'sidecars.json')
                      check_inventory(names, archive.open, lambda m:m.file_size, 'windows')
                      stamp = names['BUILD_INFO.txt']
                      assert stamp.file_size <= 4096
                      return archive.read(stamp)
              with tarfile.open(path, 'r:gz') as archive:
                  names = {x.name.removeprefix('./'):x for x in archive.getmembers() if x.isfile()}
                  assert required <= names.keys(), f'{path.name}: missing binaries'
                  if 'macOS-arm64' in path.name:
                      check_components(names, archive.extractfile, lambda m:m.size, 'macos', 'aarch64', 'Remote EX.app/Contents/MacOS/', 'Remote EX.app/Contents/Resources/sidecars.json')
                  else:
                      check_components(names, archive.extractfile, lambda m:m.size, 'linux', 'x86_64', '', 'sidecars.json')
                  check_inventory(names, archive.extractfile, lambda m:m.size, 'macos' if 'macOS-arm64' in path.name else 'linux')
                  stamp = names['BUILD_INFO.txt']
                  assert stamp.size <= 4096
                  return archive.extractfile(stamp).read()
          for suffix, required, arch in cases:
              path = root / f'Remote-EX-{tag}-{suffix}'
              info = dict(line.split('=',1) for line in inspect(path, required).decode('utf-8-sig').splitlines() if '=' in line)
              assert info.get('commit') == sha, f'{path.name}: wrong commit'
              assert info.get('release') == tag, f'{path.name}: wrong release tag'
              assert info.get('architecture','').lower() == arch, f'{path.name}: wrong architecture'
              print(f'Validated {path.name}: {sha}, {arch}')
          PY
          test -s "release/Remote-EX-$TAG-Windows-x64-Setup.exe"
          test -s "release/Remote-EX-$TAG-macOS-arm64.dmg"
          test "$(dpkg-deb -f "release/Remote-EX-$TAG-Linux-x64.deb" Architecture)" = amd64
          (cd release && sha256sum Remote-EX-* RELEASE_BUILD.json > SHA256SUMS.txt)
      - name: Publish the immutable alpha release
        if: steps.gate.outputs.ready == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$REPO/git/ref/heads/master" --jq '.object.sha')" == "$HEAD_SHA" ]]
          if gh release view "$TAG" --repo "$REPO" --json tagName >/dev/null 2>&1; then
            echo 'Release already exists; skip.'
            exit 0
          fi
          # Refuse an existing tag pointing at a different revision. Never move tags.
          refs="$(gh api "repos/$REPO/git/matching-refs/tags/$TAG")"
          existing="$(jq -c --arg tag "refs/tags/$TAG" '.[] | select(.ref == $tag)' <<< "$refs")"
          if [[ -n "$existing" ]]; then
            jq -e --arg sha "$HEAD_SHA" '.object.type == "commit" and .object.sha == $sha' <<< "$existing" >/dev/null
          fi
          cat > release-notes.md <<'NOTES'
          ## Remote EX alpha preview / 预览版

          Six packages built from the same verified source revision.
          七项同提交 CI 全部通过后发布，三平台安装包与便携包均可下载。
          This is an experimental pre-release, not a production-ready remote desktop.
          Includes portable archives, unsigned current-user Windows Setup,
          an ad-hoc signed macOS app in DMG, and Linux DEB for the build distribution. Native Wayland, real-device input/audio, display
          permissions, suspend/lock behavior, and power actions still require
          testing on authorized devices. Physical display privacy and Windows/macOS
          virtual display drivers are not supported. Startup is offline by default.

          ### Changes since alpha.1
          - Windows Setup, macOS DMG and Linux DEB installers in addition to portable archives.
          - Local runtime/component checks, official release lookup and downloaded-file SHA-256 verification.
          - Eight complete 423-key UI dictionaries and system-font routed toolbar rendering with fallback.
          - Saved WSS server configurations, challenge-only connection preflight and consistent private CA validation.
          - Self-host signaling container, configuration preflight and graceful shutdown; dependency-license evidence.
          - Smaller Linux archives; no external GStreamer or fonts redistributed.

          ### Packages
          - Windows x64: run the unsigned per-user Setup.exe or extract the ZIP. Requires
            WebView2 and the matching official GStreamer 1.26.11 MSVC x64 runtime.
          - macOS ARM64: open the DMG and copy Remote EX.app to Applications, or extract tar.gz. The app is
            ad-hoc signed, not Developer ID signed/notarized; requires the official
            GStreamer 1.26.11 framework and ordinary Screen Recording/Accessibility
            permissions when explicitly sharing or controlling a desktop.
          - Linux x64: use the DEB on a compatible distribution or extract the development tar.gz (debug build); needs a
            compatible Linux distribution, WebKitGTK, GStreamer and the documented
            desktop/portal dependencies. Real Wayland compositor compatibility is
            experimental.

          Each archive includes a rendezvous-server binary for manual self-hosting.
          No public server is deployed by this release. External GStreamer
          runtimes are not bundled. See the included development build guide.
          Verify downloads with SHA256SUMS.txt before use. RELEASE_BUILD.json records
          exact source revision, seven successful workflow IDs and all six package hashes.
          Checksums and ad-hoc signatures do not establish publisher identity.
          Third-party license review and real-device acceptance remain incomplete.
          NOTES
          printf '\nSource commit: %s\n' "$HEAD_SHA" >> release-notes.md
          printf '\n[Build and runtime guide](https://github.com/%s/blob/%s/docs/DEV_BUILD.md)\n' "$REPO" "$HEAD_SHA" >> release-notes.md
          gh release create "$TAG" release/Remote-EX-* release/SHA256SUMS.txt release/RELEASE_BUILD.json \
            --repo "$REPO" --target "$HEAD_SHA" --title "Remote EX $TAG" \
            --notes-file release-notes.md --prerelease --latest=false
          gh release view "$TAG" --repo "$REPO" --json url,tagName,isPrerelease,assets
