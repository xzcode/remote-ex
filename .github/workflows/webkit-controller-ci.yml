name: WebKit controller compatibility
on:
  push:
    branches: [master]
    paths:
      - 'scripts/ci/test-webkit-controller.mjs'
      - 'apps/web/test-view-x11.mjs'
      - 'apps/web/view.html'
      - 'apps/web/view-page.js'
      - 'apps/web/mobile.html'
      - 'apps/web/mobile.js'
      - 'apps/web/controller-ui.js'
      - 'apps/web/style.css'
      - 'scripts/stage-mobile-client.mjs'
      - 'scripts/ci/webkit-receiver-pixels.mjs'
      - 'scripts/ci/x11-root-samples.py'
      - 'apps/web/touch.js'
      - 'apps/web/input.js'
      - 'apps/web/connection-book.js'
      - 'apps/web/view-session.js'
      - 'scripts/ci/webkit-controller-runtime.sh'
      - '.github/workflows/webkit-controller-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-controller-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed controller WASM
        timeout-minutes: 7
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.106 --locked
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build --release --manifest-path apps/web/crypto/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir apps/web/pkg --out-name noise apps/web/crypto/target/wasm32-unknown-unknown/release/remote_ex_web_crypto.wasm
      - name: Install pinned Playwright package
        timeout-minutes: 4
        working-directory: apps/web
        run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: remote-ex-webkit-ubuntu24-playwright-1.56.1
      - name: Install WebKit system dependencies
        timeout-minutes: 10
        working-directory: apps/web
        run: npx playwright install-deps webkit
      - name: Install pinned WebKit browser binaries
        timeout-minutes: 10
        working-directory: apps/web
        run: npx playwright install webkit
      - name: Actual HTTPS WebKit identity and capability gates (no media)
        id: identity_gate
        timeout-minutes: 5
        run: |
          node --check scripts/ci/test-webkit-controller.mjs
          bash -n scripts/ci/webkit-controller-runtime.sh
          bash scripts/ci/webkit-controller-runtime.sh

      - name: Build independent native X11 screen sender and WSS rendezvous
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice build-essential libclang-dev clang libpipewire-0.3-dev libspa-0.2-dev libxcb1-dev libxcb-randr0-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libdbus-1-dev xvfb xauth x11-xserver-utils gstreamer1.0-pipewire python3-pil
          cargo build -p remote-ex-rendezvous
          cargo build --manifest-path crates/media/Cargo.toml --features native-x11-view --bin routed_x11_view
      - name: WebKit receive-only actual Xvfb desktop through trusted staged HTTPS and native WSS
        timeout-minutes: 5
        run: |
          node scripts/ci/webkit-receiver-pixels.mjs --self-test
          bash scripts/ci/webkit-controller-runtime.sh --native-receiver
