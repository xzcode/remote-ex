name: WebKit controller compatibility
on:
  push:
    branches: [master]
    paths:
      - 'scripts/ci/test-webkit-controller.mjs'
      - 'scripts/ci/webkit-controller-runtime.sh'
      - '.github/workflows/webkit-controller-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-controller-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed controller WASM
        timeout-minutes: 7
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.106 --locked
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build --release --manifest-path apps/web/crypto/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir apps/web/pkg --out-name noise apps/web/crypto/target/wasm32-unknown-unknown/release/remote_ex_web_crypto.wasm
      - name: Install pinned Playwright package
        timeout-minutes: 4
        working-directory: apps/web
        run: npm install --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: remote-ex-webkit-ubuntu24-playwright-1.56.1
      - name: Install WebKit system dependencies
        timeout-minutes: 10
        working-directory: apps/web
        run: npx playwright install-deps webkit
      - name: Install pinned WebKit browser binaries
        timeout-minutes: 10
        working-directory: apps/web
        run: npx playwright install webkit
      - name: Actual HTTPS WebKit identity, capability and authenticated synthetic media
        timeout-minutes: 6
        run: |
          node --check scripts/ci/test-webkit-controller.mjs
          bash -n scripts/ci/webkit-controller-runtime.sh
          bash scripts/ci/webkit-controller-runtime.sh
