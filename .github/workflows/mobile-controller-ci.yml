name: Mobile controller candidate
on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'crates/security/**'
      - 'scripts/stage-mobile-client.mjs'
      - 'scripts/test-mobile-stage.mjs'
      - 'scripts/verify-mobile-stage.mjs'
      - 'scripts/test-mobile-verify.mjs'
      - 'scripts/configure-ios-controller.py'
      - 'scripts/ci/mobile-android-runtime.sh'
      - 'scripts/ci/mobile-ios-runtime.sh'
      - '.github/workflows/mobile-controller-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-controller-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify mobile gestures, ICE and asset configuration
        run: |
          (cd apps/web && npm run test:touch && npm run test:policy-input && npm run test:session-policy && npm run test:connection-book && npm run test:wasm-loader && node --check mobile.js && node --check capabilities.js)
          node scripts/test-mobile-stage.mjs
      - name: Build existing WASM session core
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.106 --locked
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build --release --manifest-path apps/web/crypto/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir apps/web/pkg --out-name noise apps/web/crypto/target/wasm32-unknown-unknown/release/remote_ex_web_crypto.wasm
      - name: Stage offline Android development assets
        run: |
          mkdir -p build
          node scripts/stage-mobile-client.mjs build/mobile-assets
          node scripts/verify-mobile-stage.mjs build/mobile-assets
          node scripts/test-mobile-verify.mjs build/mobile-assets
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/mobile-assets")
          assert json.loads((p/"view-config.json").read_text()) == {"schema":1,"mode":"disabled"}
          assert "connect-src 'self';" in json.loads((p/"headers.json").read_text())["Content-Security-Policy"]
          assert not list(p.glob("*fixture*"))
          PY
      - name: Provision Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Android debug compile (offline config, not a release)
        working-directory: apps/mobile/android
        run: |
          command -v sdkmanager
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          gradle --no-daemon :app:assembleDebug
      - name: Inspect APK assets and permissions
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path("apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(p) as z:
              assert json.loads(z.read("assets/view-config.json")) == {"schema":1,"mode":"disabled"}
              for n in ("mobile.html","view.html","touch.js","session-policy.js","connection-book.js","wasm-loader.js","capabilities.js","pkg/noise_bg.wasm","headers.json"):
                  assert z.getinfo("assets/"+n).file_size > 0
              assert not any("fixture" in n for n in z.namelist() if n.startswith("assets/"))
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Remote-EX-Android-offline-debug-candidate
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build separate Android runtime test APK
        working-directory: apps/mobile/android
        run: gradle --no-daemon :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Remote-EX-Android-offline-test-apk
          path: apps/mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

  android_runtime:
    # Never rebuild the APK under test or use artifacts from another run.
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            expectation: legacy
          - api: 37
            expectation: supported
    name: Android runtime API ${{ matrix.api }} (${{ matrix.expectation }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: actions/download-artifact@v4
        with:
          name: Remote-EX-Android-offline-debug-candidate
          path: apps/mobile/android/app/build/outputs/apk/debug
      - uses: actions/download-artifact@v4
        with:
          name: Remote-EX-Android-offline-test-apk
          path: apps/mobile/android/app/build/outputs/apk/androidTest/debug
      - name: Android actual offline WebView runtime on disposable emulator
        timeout-minutes: 19
        env:
          REMOTE_EX_ANDROID_API: ${{ matrix.api }}
          REMOTE_EX_ANDROID_EXPECTATION: ${{ matrix.expectation }}
        run: bash scripts/ci/mobile-android-runtime.sh

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check offline and configured iOS manifests
        run: |
          python3 - <<'PY'
          import importlib.util, plistlib, tempfile
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("ios_config","scripts/configure-ios-controller.py")
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          data=plistlib.loads(m.SOURCE.read_bytes())
          assert not data["RemoteEXControllerOrigin"] and not data["WKAppBoundDomains"]
          assert "NSAppTransportSecurity" not in data
          for bad in ("http://example.net","https://example.net/","https://example.net:8443","https://user@example.net","https://127.0.0.1","https://bad..example.net","https://*.example.net"):
              try: m.origin_host(bad)
              except ValueError: pass
              else: raise AssertionError(bad)
          with tempfile.TemporaryDirectory() as d:
              out=Path(d)/"Reviewed.plist";m.stage(out,"https://mobile.example.invalid")
              v=plistlib.loads(out.read_bytes())
              assert v["WKAppBoundDomains"]==["mobile.example.invalid"]
              assert v["RemoteEXControllerOrigin"]=="https://mobile.example.invalid"
              try: m.stage(out,"https://other.example.invalid")
              except FileExistsError: pass
              else: raise AssertionError("overwrite accepted")
          PY
          plutil -lint apps/mobile/ios/Info.plist
          plutil -lint apps/mobile/ios/RemoteEX.xcodeproj/project.pbxproj
      - name: Build unsigned offline simulator app
        run: |
          xcodebuild -project apps/mobile/ios/RemoteEX.xcodeproj -scheme RemoteEX -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-derived CODE_SIGNING_ALLOWED=NO build
          test -f build/ios-derived/Build/Products/Debug-iphonesimulator/RemoteEX.app/RemoteEX
      - name: Inspect simulator candidate
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path("build/ios-derived/Build/Products/Debug-iphonesimulator/RemoteEX.app/Info.plist")
          v=plistlib.loads(p.read_bytes())
          assert not v["RemoteEXControllerOrigin"] and not v["WKAppBoundDomains"]
          assert "NSAppTransportSecurity" not in v
          assert "UIBackgroundModes" not in v
          assert not any(k in v for k in ("NSCameraUsageDescription","NSMicrophoneUsageDescription"))
          PY
          ditto -c -k --keepParent build/ios-derived/Build/Products/Debug-iphonesimulator/RemoteEX.app /tmp/RemoteEX-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Remote-EX-iOS-offline-simulator-candidate
          path: /tmp/RemoteEX-iOS-simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: iOS actual offline install and launch on disposable simulator
        timeout-minutes: 12
        run: bash scripts/ci/mobile-ios-runtime.sh
