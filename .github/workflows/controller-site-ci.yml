name: Controller site deployment preflight
on:
  push:
    branches: [master]
    paths:
      - 'deploy/controller-site*'
      - 'deploy/remote-ex-controller-site.service.example'
      - 'scripts/test-controller-site.mjs'
      - 'scripts/test-controller-site-live.mjs'
      - 'scripts/verify-controller-site.mjs'
      - 'scripts/verify-controller-deployment.mjs'
      - 'scripts/test-controller-deployment.mjs'
      - 'deploy/controller-deployment.json.example'
      - 'scripts/stage-mobile-client.mjs'
      - 'scripts/verify-mobile-stage.mjs'
      - '.github/workflows/controller-site-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verified static HTTPS controller snapshot and exact response policy
        run: |
          node --check deploy/controller-site.mjs
          node scripts/test-controller-site.mjs
      - name: Actual HTTPS deployed asset and response verification
        run: |
          node --check scripts/verify-controller-site.mjs
          node scripts/test-controller-site-live.mjs
      - name: Check reviewed controller and actual native rendezvous configuration together
        run: |
          cargo build -p remote-ex-rendezvous
          node scripts/test-controller-deployment.mjs "$PWD/target/debug/remote-ex-rendezvous"
