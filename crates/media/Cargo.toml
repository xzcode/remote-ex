[package]
name = "remote-ex-media"
version = "0.1.0"
edition = "2021"
publish = false

# Native GStreamer dependency isolation: portable core CI does not build this crate.
[workspace]

[features]
default = []
local-screen = ["dep:xcap"]
native-x11-view = ["local-screen", "dep:winit", "dep:softbuffer", "dep:font8x8"]
native-control = ["local-screen", "remote-ex-input/native", "remote-ex-security/native-vault", "dep:minifb", "dep:arboard", "dep:winit", "dep:softbuffer", "dep:font8x8", "dep:windows-sys"]

[dependencies]
gstreamer = { version = "0.23", features = ["v1_20"] }
gstreamer-app = { version = "0.23", features = ["v1_20"] }
gstreamer-sdp = { version = "0.23", features = ["v1_20"] }
gstreamer-webrtc = { version = "0.23", features = ["v1_22"] }

xcap = { version = "=0.9.10", optional = true }

remote-ex-signaling = { path = "../signaling" }
remote-ex-security = { path = "../security" }
remote-ex-core = { path = "../core" }
remote-ex-protocol = { path = "../protocol" }
prost = "0.13"

sha2 = "0.10"
pem = "3"

remote-ex-input = { path = "../input" }
remote-ex-desktop-features = { path = "../desktop-features" }

ctrlc = "3.4"

remote-ex-rendezvous-client = { path = "../rendezvous-client" }
remote-ex-rendezvous-protocol = { path = "../rendezvous-protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
percent-encoding = "2"
zeroize = "1"
serde_json = "1"
tempfile = "3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
minifb = { version = "=0.28.0", optional = true, default-features = false }
arboard = { version = "=3.6.1", optional = true }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", optional = true, default-features = false }
font8x8 = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "=0.4.8", optional = true, default-features = false, features = ["x11", "x11-dlopen"] }
font8x8 = { version = "0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "routed_control"
path = "src/bin/routed_control.rs"
required-features = ["native-control"]

[[bin]]
name = "routed_x11_view"
path = "src/bin/routed_x11_view.rs"
required-features = ["native-x11-view"]
