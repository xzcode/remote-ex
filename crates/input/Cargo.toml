[package]
name = "remote-ex-input"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:enigo"]

[dependencies]
remote-ex-core = { path = "../core" }
remote-ex-protocol = { path = "../protocol" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = { version = "=0.6.1", optional = true, default-features = false }

[dev-dependencies]
remote-ex-security = { path = "../security" }
prost.workspace = true
