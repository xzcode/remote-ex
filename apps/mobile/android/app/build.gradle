plugins {
    id 'com.android.application'
}
android {
    namespace 'com.remoteex.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.remoteex.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha.1-mobile'
        testInstrumentationRunner 'com.remoteex.mobile.OfflineSmoke'
    }
    sourceSets {
        main.assets.srcDirs = ['../../../../build/mobile-assets']
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.named("preBuild").configure {
    doFirst {
        if (!file('../../../../build/mobile-assets/pkg/noise_bg.wasm').isFile()) {
            throw new GradleException("Stage the reviewed mobile WASM assets before building")
        }
    }
}
