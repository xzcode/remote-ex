[package]
name = "remote-ex-desktop"
version = "0.1.0"
edition = "2021"
publish = false

# Keep native dependencies out of the portable core workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Official Tauri user-login launch integration; no automatic remote access.
tauri-plugin-autostart = "=2.5.1"
# Rust-only fixed official release/runtime links and explicit HTTPS metadata.
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "=0.9.10"

remote-ex-rendezvous-client = { path = "../../../crates/rendezvous-client" }
remote-ex-signaling = { path = "../../../crates/signaling" }
remote-ex-security = { path = "../../../crates/security", features = ["native-vault"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }

rusqlite = { version = "0.32", features = ["bundled"] }

remote-ex-desktop-features = { path = "../../../crates/desktop-features" }

remote-ex-rendezvous-protocol = { path = "../../../crates/rendezvous-protocol" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ashpd = { version = "=0.14.1", default-features = false, features = ["async-io", "screencast", "remote_desktop"] }
